<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PgDocs Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222}
 form{display:flex;gap:.5rem} input{flex:1;padding:.6rem;font-size:1rem} button{padding:.6rem 1rem}
 #answer{white-space:pre-wrap;margin:1.5rem 0;line-height:1.5} #sources a{display:block;margin:.3rem 0}
 small{color:#666}
</style></head><body>
<h1>PgDocs Assistant</h1><small>Hybrid RAG over the PostgreSQL docs. Answers cite their sources.</small>
<form id="f"><input id="q" placeholder="What does fillfactor control?" required><button>Ask</button></form>
<div id="answer"></div><div id="sources"></div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const ans = document.getElementById('answer'), src = document.getElementById('sources');
  ans.textContent = ''; src.innerHTML = '';
  const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question: document.getElementById('q').value})});
  if (!r.ok) { ans.textContent = 'Error: ' + (await r.text()); return; }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts) {
      const ev = p.match(/event: (.*)/)[1], data = JSON.parse(p.match(/data: (.*)/s)[1]);
      if (ev === 'token') ans.textContent += data;
      if (ev === 'sources') src.innerHTML = '<h3>Sources</h3>' + data.map((s,i) =>
        `<a href="${s.url}" target="_blank">[${i+1}] ${s.section}</a>`).join('');
    }
  }
};
</script></body></html>
