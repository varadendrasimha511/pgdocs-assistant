services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pgdocs
      POSTGRES_PASSWORD: pgdocs
      POSTGRES_DB: pgdocs
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdocs"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pgdocs:pgdocs@db:5432/pgdocs  # "db", not 127.0.0.1
      RERANK_ENABLED: "0"  # the chat path doesn't rerank, so don't download that model
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  pgdata: